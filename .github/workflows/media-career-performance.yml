name: Media Career Performance Audit

on:
  push:
    branches: [main]
    paths:
      - 'site/media-career-program.html'
      - 'site/assets/media-career/**'
      - '.github/workflows/media-career-performance.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish Hang Doi Academy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: media-career-performance
  cancel-in-progress: true

jobs:
  lighthouse-mobile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for live landing revision
        shell: bash
        run: |
          set -euo pipefail
          URL='https://academy.hangdoiproduction.com/media-career-program/'
          for attempt in {1..12}; do
            if body="$(curl -fsSL --max-time 15 "$URL")" &&
               grep -q '/assets/media-career/program.js' <<<"$body" &&
               grep -q '/assets/media-career/program.css' <<<"$body"; then
              echo "Live landing is ready for audit."
              exit 0
            fi
            sleep 5
          done
          echo "Live landing did not expose the current asset contract." >&2
          exit 1

      - name: Run Lighthouse mobile
        run: |
          npx --yes lighthouse@12             'https://academy.hangdoiproduction.com/media-career-program/'             --only-categories=performance             --form-factor=mobile             --throttling-method=simulate             --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage'             --output=json             --output-path=lighthouse-mobile.json             --quiet

      - name: Summarize performance metrics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('lighthouse-mobile.json','utf8'));
          const a = report.audits;
          const score = Math.round((report.categories.performance.score || 0) * 100);
          const metrics = {
            'Performance': score,
            'FCP': a['first-contentful-paint']?.displayValue || 'n/a',
            'LCP': a['largest-contentful-paint']?.displayValue || 'n/a',
            'Speed Index': a['speed-index']?.displayValue || 'n/a',
            'TBT': a['total-blocking-time']?.displayValue || 'n/a',
            'CLS': a['cumulative-layout-shift']?.displayValue || 'n/a',
          };
          const md = [
            '# Media Career mobile Lighthouse',
            '',
            '| Metric | Result |',
            '| --- | ---: |',
            ...Object.entries(metrics).map(([k,v]) => `| ${k} | ${v} |`),
            '',
            '> Lighthouse is a synthetic diagnostic. It is reported for visibility and is not a deploy gate.',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
          console.log(metrics);

          const lcp = a['largest-contentful-paint']?.numericValue ?? Infinity;
          const cls = a['cumulative-layout-shift']?.numericValue ?? Infinity;
          const tbt = a['total-blocking-time']?.numericValue ?? Infinity;
          if (score < 75) console.log('::warning::Mobile Lighthouse performance score is below 75.');
          if (lcp > 4000) console.log('::warning::Mobile LCP is above 4.0s.');
          if (cls > 0.15) console.log('::warning::CLS is above 0.15.');
          if (tbt > 500) console.log('::warning::TBT is above 500ms.');
          NODE

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: media-career-lighthouse-mobile
          path: lighthouse-mobile.json
          retention-days: 14
