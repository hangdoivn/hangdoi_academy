name: Media Career Performance Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish Hang Doi Academy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: media-career-performance
  cancel-in-progress: true

jobs:
  lighthouse-mobile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact live revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          URL='https://academy.hangdoiproduction.com/media-career-program/'
          REVISION_URL='https://academy.hangdoiproduction.com/build-revision.txt'
          for attempt in {1..24}; do
            body="$(curl -fsSL --max-time 15 "$URL" || true)"
            live_sha="$(curl -fsSL --max-time 15 "$REVISION_URL?expected=$EXPECTED_SHA" 2>/dev/null | tr -d '\r\n' || true)"

            contract_ok=false
            if grep -q '/assets/media-career/program.js' <<<"$body" &&
               grep -q '/assets/media-career/program.css' <<<"$body"; then
              contract_ok=true
            fi

            revision_ok=false
            if [ -z "$EXPECTED_SHA" ]; then
              revision_ok=true
            elif [ "$live_sha" = "$EXPECTED_SHA" ]; then
              revision_ok=true
            fi

            if [ "$contract_ok" = true ] && [ "$revision_ok" = true ]; then
              echo "Live Academy revision is ready: ${live_sha:-manual-run}"
              exit 0
            fi

            echo "Waiting for live revision (attempt $attempt/24): expected=${EXPECTED_SHA:-manual} live=${live_sha:-unavailable}"
            sleep 5
          done

          echo "Live Academy did not reach the expected revision: expected=${EXPECTED_SHA:-manual}" >&2
          exit 1

      - name: Run Lighthouse mobile x3
        run: |
          cat > lighthouse-headers.json <<'JSON'
          {
            "User-Agent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36",
            "Accept-Language": "vi-VN,vi;q=0.9,en;q=0.8"
          }
          JSON
          for run in 1 2 3; do
            echo "Lighthouse mobile run $run/3"
            npx --yes lighthouse@12 'https://academy.hangdoiproduction.com/media-career-program/' \
              --only-categories=performance \
              --form-factor=mobile \
              --throttling-method=simulate \
              --extra-headers=lighthouse-headers.json \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --output=json \
              --output-path="lighthouse-mobile-$run.json" \
              --quiet
          done

      - name: Summarize median performance metrics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const reports = [1,2,3].map(i => JSON.parse(fs.readFileSync(`lighthouse-mobile-${i}.json`, 'utf8')));
          const median = values => [...values].sort((a,b)=>a-b)[1];
          const values = reports.map(report => {
            const a = report.audits;
            return {
              performance: Math.round((report.categories.performance.score || 0) * 100),
              fcp: a['first-contentful-paint']?.numericValue ?? Infinity,
              lcp: a['largest-contentful-paint']?.numericValue ?? Infinity,
              speedIndex: a['speed-index']?.numericValue ?? Infinity,
              tbt: a['total-blocking-time']?.numericValue ?? Infinity,
              cls: a['cumulative-layout-shift']?.numericValue ?? Infinity,
            };
          });
          const m = {
            performance: median(values.map(v=>v.performance)),
            fcp: median(values.map(v=>v.fcp)),
            lcp: median(values.map(v=>v.lcp)),
            speedIndex: median(values.map(v=>v.speedIndex)),
            tbt: median(values.map(v=>v.tbt)),
            cls: median(values.map(v=>v.cls)),
          };
          const sec = ms => `${(ms/1000).toFixed(1)} s`;
          const metrics = {
            'Performance': m.performance,
            'FCP': sec(m.fcp),
            'LCP': sec(m.lcp),
            'Speed Index': sec(m.speedIndex),
            'TBT': `${Math.round(m.tbt)} ms`,
            'CLS': m.cls.toFixed(3),
          };
          const runRows = values.map((v,i) =>
            `| Run ${i+1} | ${v.performance} | ${sec(v.fcp)} | ${sec(v.lcp)} | ${Math.round(v.tbt)} ms | ${v.cls.toFixed(3)} |`
          );
          const md = [
            '# Media Career mobile Lighthouse',
            '',
            '### Median of 3 runs',
            '',
            '| Metric | Median |',
            '| --- | ---: |',
            ...Object.entries(metrics).map(([k,v]) => `| ${k} | ${v} |`),
            '',
            '### Individual runs',
            '',
            '| Run | Performance | FCP | LCP | TBT | CLS |',
            '| --- | ---: | ---: | ---: | ---: | ---: |',
            ...runRows,
            '',
            '> Lighthouse is a synthetic diagnostic. Median-of-three reduces runner/network outliers and is not a deploy gate.',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
          console.log('Median', metrics);
          console.log('Runs', values);

          if (m.performance < 75) console.log('::warning::Median mobile Lighthouse performance score is below 75.');
          if (m.lcp > 4000) console.log('::warning::Median mobile LCP is above 4.0s.');
          if (m.cls > 0.15) console.log('::warning::Median CLS is above 0.15.');
          if (m.tbt > 500) console.log('::warning::Median TBT is above 500ms.');
          NODE

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: media-career-lighthouse-mobile
          path: lighthouse-mobile-*.json
          retention-days: 14
