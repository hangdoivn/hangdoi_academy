name: Publish Hang Doi Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academy-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static website
        run: |
          mkdir -p _site
          cat site/part-00.html site/part-01.html site/part-02.html site/part-03.html > _site/index.html
          printf '%s\n' 'academy.hangdoistudio.vn' > _site/CNAME
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q '</html>' _site/index.html

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
