name: Deploy Hang Doi Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static website
        run: |
          mkdir -p _site
          cat site/part-00.html site/part-01.html site/part-02.html site/part-03.html > _site/index.html
          printf '%s\n' 'academy.hangdoistudio.vn' > _site/CNAME
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q '</html>' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        if: success()
        run: |
          printf 'Deployed successfully\nCommit: %s\nURL: %s\n' "$GITHUB_SHA" "${{ steps.deployment.outputs.page_url }}" > DEPLOY_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOY_STATUS.md
          git commit -m 'Record successful Academy deployment [skip ci]' || exit 0
          git push
