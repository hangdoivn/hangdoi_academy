name: Publish Hang Doi Academy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Generate scheduled Academy blog article']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: academy-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image build dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Expand blog runtime
        run: |
          cat bootstrap/blog-system.part* | base64 --decode > /tmp/blog-system.tar.gz
          rm -rf /tmp/blog-runtime
          mkdir -p /tmp/blog-runtime
          tar -xzf /tmp/blog-system.tar.gz -C /tmp/blog-runtime
          mkdir -p scripts content/blog site
          cp /tmp/blog-runtime/scripts/build_blog.py scripts/build_blog.py
          cp /tmp/blog-runtime/scripts/blog_automation.py scripts/blog_automation.py
          cp /tmp/blog-runtime/site/blog.css site/blog.css
          cp /tmp/blog-runtime/site/blog.js site/blog.js
          if [ ! -f content/blog/topics.json ]; then
            cp -R /tmp/blog-runtime/content/blog/. content/blog/
          fi

      - name: Build static website and category blog routes
        run: |
          rm -rf _site
          mkdir -p _site
          mkdir -p _site/assets
          cp -R site/assets/. _site/assets/

          cp site/logo-academy.svg _site/logo-academy.svg
          cp site/academy-tokens.css _site/academy-tokens.css
          mkdir -p _site/assets/media-career
          cp site/assets/media-career/* _site/assets/media-career/

          # Build optimized Media Career images locally into the Pages artifact.
          # Public visitors never fetch these images from Google Drive at runtime.
          echo "Build optimized Media Career images"
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          sources = {
              "hero-bts.webp": "10KlvEAQ2t_gPpzyeX6XWfsO1kvjut-qP",
              "fourpoints.webp": "1lonK2-7tURIP_pBboac0AH0Ebs4P84HC",
              "xita.webp": "1zXJMZoiocczJf45kePNLG0KhQj1V_XfX",
              "fnb-676.webp": "1FZ2aHa-simq1liZxjXLZbzeI-DErFEYE",
              "floral-1823.webp": "17wY57k3NEp1c9kYiFIyQ7Dc4D83RJtGl",
              "floral-9532.webp": "1pXvdCfAIFULtsl9krz9eqfkjQGB66tSm",
              "fnb-805.webp": "1PyQ-jYphGE3mm59Aqh2MucNIr7A9k-ZD",
              "hd-2988.webp": "1Y7iqjyIfKY2Di6l3JvjOBCWjKCNAoaUG",
          }
          out_dir = Path("_site/assets/media-career/optimized")
          out_dir.mkdir(parents=True, exist_ok=True)

          for filename, file_id in sources.items():
              url = f"https://drive.google.com/thumbnail?id={file_id}&sz=w1200"
              req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(req, timeout=45) as response:
                  payload = response.read()
              if len(payload) < 1024:
                  raise RuntimeError(f"Image payload too small for {filename}: {len(payload)} bytes")
              with Image.open(BytesIO(payload)) as source:
                  image = ImageOps.exif_transpose(source).convert("RGB")
                  if image.width > 720:
                      height = round(image.height * 720 / image.width)
                      image = image.resize((720, height), Image.Resampling.LANCZOS)
                  image.save(out_dir / filename, "WEBP", quality=76, method=6)
                  print(filename, image.size, (out_dir / filename).stat().st_size)

          local_sources = {
              "roadmap-01-thiet-bi.webp": Path("_site/assets/media-career/roadmap-01-thiet-bi.png"),
              "roadmap-02-yeu-cau.webp": Path("_site/assets/media-career/roadmap-02-yeu-cau.png"),
              "roadmap-03-san-pham.webp": Path("_site/assets/media-career/roadmap-03-san-pham.png"),
              "roadmap-04-du-an.webp": Path("_site/assets/media-career/roadmap-04-du-an.png"),
          }
          for filename, source_path in local_sources.items():
              with Image.open(source_path) as source:
                  image = ImageOps.exif_transpose(source).convert("RGB")
                  if image.width > 720:
                      height = round(image.height * 720 / image.width)
                      image = image.resize((720, height), Image.Resampling.LANCZOS)
                  image.save(out_dir / filename, "WEBP", quality=76, method=6)
                  print(filename, image.size, (out_dir / filename).stat().st_size)
          PY

          mkdir -p _site/media-career-program
          cp site/media-career-program.html _site/media-career-program/index.html
          mkdir -p _site/media-career-program/apply
          cp site/media-career-apply.html _site/media-career-program/apply/index.html
          mkdir -p _site/media-career-program/thank-you
          cp site/media-career-thank-you.html _site/media-career-program/thank-you/index.html
          mkdir -p _site/media-career-program/admin
          cp site/media-career-admin.html _site/media-career-program/admin/index.html
          mkdir -p _site/media-career-program/selection
          cp site/media-career-selection.html _site/media-career-program/selection/index.html
          cp site/logo-academy.svg _site/favicon.svg
          cp site/logo-inline.js _site/logo-inline.js
          cp site/ui-fixes.js _site/ui-fixes.js
          cp site/blog.css _site/blog.css
          cp site/blog.js _site/blog.js
          cat site/part-00.html site/part-01.html site/part-02.html site/part-03.html > _site/index.html
          cat site/academy-v2-css-01.part site/academy-v2-css-02.part site/academy-v2-css-03.part > _site/academy-v2.css
          cat site/academy-v2-js-01.part site/academy-v2-js-02.part site/academy-v2-js-03.part site/academy-v2-js-04.part > _site/academy-v2.js
          cp site/phase1-seo.css _site/phase1-seo.css
          cp site/phase1-seo.js _site/phase1-seo.js
          cat site/phase2.css site/logo-restore.css > _site/phase2.css
          cat site/build-phase2-01.part site/build-phase2-02.part site/build-phase2-03.part > /tmp/build_phase2.py

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          page = Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace(
              '<title>Hang Đôi Academy — Học nhiếp ảnh để làm được nghề thật</title>',
              '<title>Khóa học Nhiếp ảnh tại Đà Nẵng | Hang Đôi Academy</title>',
          )
          html = html.replace(
              'content="Hang Đôi Academy — Học nhiếp ảnh để làm được nghề thật. Lộ trình cá nhân hóa, thực hành tại studio và hoàn thiện portfolio."',
              'content="Khóa học nhiếp ảnh tại Đà Nẵng từ cơ bản đến chuyên sâu. Thực hành tại studio, học kỹ thuật, ánh sáng, hậu kỳ và hoàn thiện portfolio tại Hang Đôi Academy."',
          )
          html = html.replace(
              '<meta name="theme-color" content="#101714" />',
              '<meta name="theme-color" content="#fffef9" />',
          )
          html = re.sub(
              r'<link\s+[^>]*rel=["\'](?:shortcut\s+icon|icon)["\'][^>]*>',
              '',
              html,
              flags=re.I,
          )

          structured = {
              '@context': 'https://schema.org',
              '@graph': [
                  {
                      '@type': ['EducationalOrganization', 'LocalBusiness'],
                      '@id': 'https://academy.hangdoiproduction.com/#organization',
                      'name': 'Hang Đôi Academy',
                      'url': 'https://academy.hangdoiproduction.com/',
                      'logo': 'https://academy.hangdoiproduction.com/logo-academy.svg',
                      'telephone': '+84888445997',
                      'address': {
                          '@type': 'PostalAddress',
                          'streetAddress': '98 Điện Biên Phủ',
                          'addressLocality': 'Đà Nẵng',
                          'addressCountry': 'VN',
                      },
                      'parentOrganization': {
                          '@type': 'Organization',
                          'name': 'Hang Đôi Production',
                          'url': 'https://hangdoistudio.vn/',
                      },
                      'areaServed': {'@type': 'City', 'name': 'Đà Nẵng'},
                  },
                  {
                      '@type': 'WebSite',
                      '@id': 'https://academy.hangdoiproduction.com/#website',
                      'url': 'https://academy.hangdoiproduction.com/',
                      'name': 'Hang Đôi Academy',
                      'inLanguage': 'vi-VN',
                      'publisher': {'@id': 'https://academy.hangdoiproduction.com/#organization'},
                  },
                  {
                      '@type': 'FAQPage',
                      'mainEntity': [
                          {
                              '@type': 'Question',
                              'name': 'Người chưa biết sử dụng máy ảnh có học được không?',
                              'acceptedAnswer': {
                                  '@type': 'Answer',
                                  'text': 'Có. Khóa Nhiếp ảnh cơ bản bắt đầu từ thông số phơi sáng, lấy nét, tiêu cự và cân bằng trắng.',
                              },
                          },
                          {
                              '@type': 'Question',
                              'name': 'Có cần mua máy ảnh trước khi đăng ký không?',
                              'acceptedAnswer': {
                                  '@type': 'Answer',
                                  'text': 'Không bắt buộc. Academy có môi trường studio và thiết bị phục vụ thực hành.',
                              },
                          },
                      ],
                  },
              ],
          }
          head = (
              '<link rel="canonical" href="https://academy.hangdoiproduction.com/">'
              '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">'
              '<meta property="og:type" content="website">'
              '<meta property="og:locale" content="vi_VN">'
              '<meta property="og:site_name" content="Hang Đôi Academy">'
              '<meta property="og:title" content="Khóa học Nhiếp ảnh tại Đà Nẵng | Hang Đôi Academy">'
              '<meta property="og:description" content="Học nhiếp ảnh thực hành tại studio, từ kỹ thuật và ánh sáng đến hậu kỳ và portfolio.">'
              '<meta property="og:url" content="https://academy.hangdoiproduction.com/">'
              '<meta name="twitter:card" content="summary_large_image">'
              '<link rel="icon" type="image/svg+xml" href="/favicon.svg">'
              '<link rel="stylesheet" href="academy-v2.css">'
              '<link rel="stylesheet" href="phase1-seo.css">'
              '<link rel="stylesheet" href="phase2.css">'
              '<script type="application/ld+json">'
              + json.dumps(structured, ensure_ascii=False, separators=(',', ':'))
              + '</script>'
          )
          html = html.replace('</head>', head + '</head>')
          html = html.replace(
              '</body>',
              '<script src="academy-v2.js"></script>'
              '<script src="phase1-seo.js"></script>'
              '<script src="logo-inline.js"></script>'
              '<script src="ui-fixes.js"></script></body>',
          )
          page.write_text(html, encoding='utf-8')
          PY

          python /tmp/build_phase2.py
          python scripts/build_blog.py --out _site --content content/blog
          python scripts/nest_blog_routes.py \
            --site _site \
            --config config/blog-categories.json

          # Inline the official logo after all pages, including blog pages, exist.
          python - <<'PY'
          from pathlib import Path
          import re

          out = Path('_site')
          svg = (out / 'logo-academy.svg').read_text(encoding='utf-8')
          svg = re.sub(r'<\?xml[^>]*>\s*', '', svg, count=1).strip()
          svg = re.sub(
              r'<svg\b',
              '<svg class="academy-logo-svg" aria-hidden="true" focusable="false"',
              svg,
              count=1,
          )

          critical = '''<style id="academy-logo-critical">
          header.site-header,header.site-header.scrolled{background:linear-gradient(90deg,#fffef9,#f5f7f1)!important;border-color:rgba(23,56,43,.12)!important}
          .site-header .nav-links a,.site-header.scrolled .nav-links a{color:#17382b!important}
          .brand-official,.p2-brand{display:inline-flex!important;align-items:center!important;width:200px!important;min-width:200px!important;height:40px!important;padding:0!important;border:0!important;background:none!important;background-image:none!important}
          .brand-official>*{opacity:1!important;visibility:visible!important}
          .brand-official .academy-logo-svg,.p2-brand .academy-logo-svg{display:block!important;width:200px!important;max-height:40px!important;height:auto!important;opacity:1!important;visibility:visible!important}
          footer .brand-official,.p2-footer-logo{width:220px!important;min-width:220px!important;height:48px!important}
          footer .academy-logo-svg,.p2-footer-logo .academy-logo-svg{display:block!important;width:220px!important;max-height:48px!important;height:auto!important;opacity:1!important;visibility:visible!important}
          footer .academy-logo-svg .cls-1,.p2-footer .academy-logo-svg .cls-1{fill:#fff!important}
          footer .academy-logo-svg .cls-2,.p2-footer .academy-logo-svg .cls-2{fill:#fcb415!important}
          @media(max-width:760px){.brand-official,.p2-brand{width:170px!important;min-width:170px!important;height:34px!important}.brand-official .academy-logo-svg,.p2-brand .academy-logo-svg{width:170px!important;max-height:34px!important}footer .brand-official,.p2-footer-logo{width:190px!important;min-width:190px!important;height:42px!important}footer .academy-logo-svg,.p2-footer-logo .academy-logo-svg{width:190px!important;max-height:42px!important}}
          </style>'''

          for page in out.rglob('index.html'):
              content = page.read_text(encoding='utf-8')
              content = content.replace('<script defer src="/logo-inline.js"></script>', '')
              content = content.replace('<script src="logo-inline.js"></script>', '')
              content = re.sub(
                  r'<link\s+[^>]*rel=["\'](?:shortcut\s+icon|icon)["\'][^>]*>',
                  '',
                  content,
                  flags=re.I,
              )
              content = re.sub(
                  r'(<a[^>]*class="[^"]*\bbrand-official\b[^"]*"[^>]*>).*?(</a>)',
                  lambda match: match.group(1) + svg + match.group(2),
                  content,
                  flags=re.S,
              )
              content = re.sub(
                  r'(<a[^>]*class="[^"]*\bp2-brand\b[^"]*"[^>]*>).*?(</a>)',
                  lambda match: match.group(1) + svg + match.group(2),
                  content,
                  flags=re.S,
              )
              content = content.replace(
                  '<strong>Hang Đôi Academy</strong>',
                  '<strong class="p2-footer-logo">' + svg + '</strong>',
              )
              additions = '<link rel="icon" type="image/svg+xml" href="/favicon.svg">' + critical
              if 'academy-logo-critical' not in content:
                  content = content.replace('</head>', additions + '</head>')
              else:
                  content = content.replace(
                      '</head>',
                      '<link rel="icon" type="image/svg+xml" href="/favicon.svg"></head>',
                  )
              page.write_text(content, encoding='utf-8')
          PY

          printf '%s\n' 'academy.hangdoiproduction.com' > _site/CNAME
          cat > _site/robots.txt <<'TXT'
          User-agent: *
          Allow: /

          User-agent: OAI-SearchBot
          Allow: /

          Sitemap: https://academy.hangdoiproduction.com/sitemap.xml
          TXT

          cat > _site/llms.base.txt <<'TXT'
          # Hang Đôi Academy
          Hang Đôi Academy là đơn vị đào tạo nhiếp ảnh thực hành tại 98 Điện Biên Phủ, Đà Nẵng.
          Website chính: https://academy.hangdoiproduction.com/
          Điện thoại tư vấn: 0888 445 997

          ## Chương trình
          - Nhiếp ảnh cơ bản: 12 buổi, học phí 6.680.000đ.
          - Kỹ thuật nhiếp ảnh: 18.680.000đ cho một kỹ năng chuyên sâu.
          - Kỹ thuật ánh sáng: 18.680.000đ cho một kỹ năng chuyên sâu.
          - Chỉnh sửa hình ảnh: 18.680.000đ cho một kỹ năng chuyên sâu.
          - Nhiếp ảnh toàn tập: 40.000.000đ, có thể chia tối đa 3 đợt.

          ## Nội dung chuyên sâu
          - Danh sách khóa học: https://academy.hangdoiproduction.com/khoa-hoc/
          - Giảng viên và phương pháp: https://academy.hangdoiproduction.com/giang-vien/
          - Hành trình học viên: https://academy.hangdoiproduction.com/hoc-vien/
          - Kiến thức nhiếp ảnh: https://academy.hangdoiproduction.com/blog/
          TXT
          if [ -f _site/llms.txt ]; then
            sed -n '/^## Bài viết đã xuất bản/,$p' _site/llms.txt >> _site/llms.base.txt || true
          fi
          mv _site/llms.base.txt _site/llms.txt
          touch _site/.nojekyll

      - name: Verify build contract
        run: |
          test -s _site/index.html
          test "$(tr -d '\r\n' < _site/CNAME)" = "academy.hangdoiproduction.com"
          test -s _site/logo-academy.svg
          test -s _site/academy-tokens.css
          test -s _site/assets/media-career/roadmap-01-thiet-bi.png
          test -s _site/assets/media-career/roadmap-02-yeu-cau.png
          test -s _site/assets/media-career/roadmap-03-san-pham.png
          test -s _site/assets/media-career/roadmap-04-du-an.png
          test -s _site/assets/media-career/optimized/hero-bts.webp
          test -s _site/assets/media-career/optimized/fourpoints.webp
          test -s _site/assets/media-career/optimized/xita.webp
          test -s _site/assets/media-career/optimized/fnb-676.webp
          test -s _site/assets/media-career/optimized/floral-1823.webp
          test -s _site/assets/media-career/optimized/floral-9532.webp
          test -s _site/assets/media-career/optimized/fnb-805.webp
          test -s _site/assets/media-career/optimized/hd-2988.webp
          test -s _site/assets/media-career/optimized/roadmap-01-thiet-bi.webp
          test -s _site/assets/media-career/optimized/roadmap-02-yeu-cau.webp
          test -s _site/assets/media-career/optimized/roadmap-03-san-pham.webp
          test -s _site/assets/media-career/optimized/roadmap-04-du-an.webp
          if grep -q 'drive.google.com/thumbnail' _site/media-career-program/index.html; then
            echo "Runtime Google Drive image dependency remains in Media Career landing" >&2
            exit 1
          fi
          if grep -Eq '/assets/media-career/roadmap-0[1-4][^"[:space:]]*\.(png|jpg)' _site/media-career-program/index.html; then
            echo "Runtime large roadmap image dependency remains in Media Career landing" >&2
            exit 1
          fi
          test -s _site/favicon.svg
          test -s _site/ui-fixes.js
          test -s _site/phase2.css
          test -s _site/blog.css
          test -s _site/blog.js
          test -s _site/khoa-hoc/index.html
          test -s _site/nhiep-anh-co-ban/index.html
          test -s _site/blog/index.html
          test -s _site/blog/feed.xml
          test -s _site/blog/routes.json
          grep -qi '<svg' _site/logo-academy.svg
          grep -q 'academy-logo-svg' _site/index.html
          grep -q 'academy-logo-critical' _site/index.html
          grep -q 'Course' _site/nhiep-anh-co-ban/index.html
          grep -q 'CollectionPage' _site/blog/index.html
          if rg -n 'academy\.hangdoistudio\.vn' _site; then
            echo "Legacy Academy hostname found in generated site" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('_site')
          manifest = json.loads((root / 'blog/routes.json').read_text(encoding='utf-8'))
          assert manifest['route_pattern'] == '/blog/{category_slug}/{article_slug}/'
          assert manifest['articles'], 'No articles in route manifest'
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          for article in manifest['articles']:
              nested = root / 'blog' / article['category_slug'] / article['article_slug'] / 'index.html'
              legacy = root / 'blog' / article['article_slug'] / 'index.html'
              category = root / 'blog' / article['category_slug'] / 'index.html'
              assert nested.is_file(), nested
              assert legacy.is_file(), legacy
              assert category.is_file(), category
              nested_html = nested.read_text(encoding='utf-8')
              legacy_html = legacy.read_text(encoding='utf-8')
              assert article['url'] in nested_html, nested
              assert 'BlogPosting' in nested_html, nested
              assert 'BreadcrumbList' in nested_html, nested
              assert 'noindex,follow' in legacy_html, legacy
              assert article['url'] in sitemap, article['url']
          print(f"Verified {len(manifest['articles'])} nested blog routes")
          PY

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
