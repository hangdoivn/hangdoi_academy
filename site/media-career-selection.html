<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Selection Confirmation | Hang Đôi Academy</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--blue:#152BE8;--yellow:#FDDE58;--ink:#00031A;--mist:#F3F5FF;--line:#D9DDEC;--muted:#646B86;--red:#B42318;--green:#157A55}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--mist);color:var(--ink);min-height:100vh}.wrap{width:min(calc(100% - 28px),860px);margin:auto;padding:28px 0 54px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.top img{width:190px}.tag{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 24px 80px rgba(0,3,26,.08)}h1{font-size:clamp(42px,7vw,68px);line-height:.96;letter-spacing:-.055em;margin:10px 0 20px}.lead{font-size:17px;color:#4d546d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.info{background:var(--mist);border-radius:14px;padding:14px}.info small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.info b{font-size:15px}.note{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;white-space:pre-wrap}.response{margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:900;cursor:pointer}.confirm{background:var(--ink);color:#fff}.decline{background:#fff;color:var(--ink);border:1px solid var(--line)}.status{margin-top:14px;font-size:13px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="/"><img src="/logo-academy.svg" alt="Hang Đôi Academy"></a><div class="tag">Media Career · Selection</div></div>
<main class="card">
<div class="tag">Cohort 01</div>
<h1>SELECTION<br>CONFIRMATION.</h1>
<div id="loading" class="lead">Đang tải thông tin Selection…</div>
<div id="content" hidden>
<p class="lead">Xin chào <b id="name"></b>. Đây là lịch Selection của bạn cho Hang Đôi Media Career Program.</p>
<div class="grid">
<div class="info"><small>Candidate ID</small><b id="code"></b></div>
<div class="info"><small>Status</small><b id="selStatus"></b></div>
<div class="info"><small>Thời gian</small><b id="time"></b></div>
<div class="info"><small>Thời lượng</small><b id="duration"></b></div>
<div class="info"><small>Hình thức</small><b id="mode"></b></div>
<div class="info"><small>Địa điểm / Link</small><b id="location"></b></div>
</div>
<div id="inviteNote" class="note" hidden></div>
<div id="prepNote" class="note" hidden></div>
<section id="responseBox" class="response">
<label for="note"><b>Ghi chú cho Hang Đôi</b> <span style="color:var(--muted)">(không bắt buộc)</span></label>
<textarea id="note" placeholder="Ví dụ: Em xác nhận tham gia / Em cần team hỗ trợ đổi lịch…"></textarea>
<div class="actions"><button id="confirmBtn" class="btn confirm">Xác nhận tham gia</button><button id="declineBtn" class="btn decline">Không thể tham gia lịch này</button></div>
<div id="status" class="status"></div>
</section>
</div>
</main>
</div>
<script>
const API="https://candidate-api-v2-production.up.railway.app";
const token=new URLSearchParams(location.search).get("token")||"";
const $=id=>document.getElementById(id);
let selection=null;
function fmt(date){return new Intl.DateTimeFormat("vi-VN",{timeZone:"Asia/Ho_Chi_Minh",dateStyle:"full",timeStyle:"short"}).format(new Date(date))}
async function load(){
  if(!token){$("loading").textContent="Link Selection không hợp lệ.";return}
  try{
    const r=await fetch(API+"/v1/selection/"+encodeURIComponent(token));
    const j=await r.json();if(!r.ok)throw new Error(j.error||"Không tải được lịch");
    selection=j.selection;$("loading").hidden=true;$("content").hidden=false;
    $("name").textContent=selection.full_name;$("code").textContent=selection.candidate_code;
    $("selStatus").textContent=selection.status;$("time").textContent=selection.selection_start?fmt(selection.selection_start):"Chưa chốt";
    $("duration").textContent=selection.duration_minutes+" phút";$("mode").textContent=selection.mode==="ONLINE"?"Online":"Tại Hang Đôi / Onsite";
    $("location").textContent=selection.location||"Chưa chốt";
    if(selection.invitation_note){$("inviteNote").hidden=false;$("inviteNote").textContent=selection.invitation_note}
    if(selection.prep_note){$("prepNote").hidden=false;$("prepNote").innerHTML="<b>Chuẩn bị trước Selection</b><br>"+selection.prep_note.replace(/\n/g,"<br>")}
    if(["ATTENDED","CANCELLED","NO_SHOW"].includes(selection.status)){$("responseBox").hidden=true}
  }catch(e){$("loading").textContent=e.message}
}
async function respond(response){
  $("confirmBtn").disabled=true;$("declineBtn").disabled=true;$("status").textContent="Đang ghi nhận phản hồi…";$("status").className="status";
  try{
    const r=await fetch(API+"/v1/selection/"+encodeURIComponent(token)+"/respond",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({response,note:$("note").value})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||"Không lưu được phản hồi");
    $("selStatus").textContent=j.status;$("status").textContent=j.status==="CONFIRMED"?"Đã xác nhận. Hẹn gặp bạn tại Selection.":"Hang Đôi đã ghi nhận bạn không thể tham gia lịch này và sẽ review bước tiếp theo.";$("status").className="status ok";
  }catch(e){$("status").textContent=e.message;$("status").className="status err"}finally{$("confirmBtn").disabled=false;$("declineBtn").disabled=false}
}
$("confirmBtn").onclick=()=>respond("CONFIRMED");$("declineBtn").onclick=()=>respond("DECLINED");load();
</script>
</body>
</html>
