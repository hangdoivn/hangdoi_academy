<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Đã nhận đăng ký | Hang Đôi Academy</title><link rel="icon" type="image/svg+xml" href="/logo-academy.svg"><style>
:root{--ink:#0b2418;--green:#0b6a3f;--paper:#f8f4ea;--yellow:#f4c542}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(calc(100% - 28px),760px);padding:42px;border:1px solid rgba(11,36,24,.12);border-radius:30px;background:#fff;box-shadow:0 24px 80px rgba(11,36,24,.08)}img{width:190px}.tag{margin-top:48px;color:var(--green);font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}h1{margin:10px 0 18px;font-size:clamp(44px,8vw,76px);line-height:.92;letter-spacing:-.06em}p{font-size:16px;line-height:1.65;color:#56655c}.code{display:inline-block;margin:8px 0 16px;padding:10px 14px;border-radius:12px;background:var(--yellow);font-weight:900}.btn{display:inline-flex;margin-top:14px;padding:13px 18px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:900;font-size:11px}@media(max-width:600px){.card{padding:28px 22px;border-radius:22px}img{width:155px}}
</style></head><body><main class="card"><a href="/"><img src="/logo-academy.svg" alt="Hang Đôi Academy"></a><div class="tag">Đăng ký học viên</div><h1>ĐÃ NHẬN<br>ĐĂNG KÝ.</h1><div id="code" class="code" hidden></div><p>Hang Đôi Academy đã nhận thông tin của bạn. Team sẽ liên hệ để xác nhận khóa học, lịch học và hướng dẫn bước tiếp theo.</p><p>Việc gửi form chưa phát sinh thanh toán.</p><a class="btn" href="/khoa-hoc/">Xem các khóa học →</a></main><script>const p=new URLSearchParams(location.search),c=p.get("code")||"";if(c){const e=document.getElementById("code");e.textContent="Mã đăng ký: "+c;e.hidden=false}</script></body></html>
